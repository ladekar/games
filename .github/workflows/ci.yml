name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f games/requirements.txt ]; then pip install -r games/requirements.txt; fi

      - name: Run import smoke tests
        run: |
          python -c "import sys; sys.path.append('games'); import brain_tease; print('brain_tease import OK')"

      - name: Run optional tests (pytest)
        run: |
          if command -v pytest >/dev/null 2>&1; then pytest -q; else echo 'pytest not installed or no tests'; fi
