<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Snake — Pandai Games</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
      .snake-wrap{display:flex;gap:20px;align-items:flex-start}
      canvas{background:#0b1220;border-radius:8px}
      .side{min-width:200px}
      .info{color:#334155}
      .controls{margin-top:12px}
    </style>
  </head>
  <body>
    <header class="small-header">
      <div class="wrap">
        <a href="/" class="back">← Dashboard</a>
        <h1>Snake</h1>
      </div>
    </header>
    <main class="wrap game-wrap">
      <div class="snake-wrap">
        <canvas id="c" width="480" height="480"></canvas>
        <div class="side">
          <div class="card">
            <h3>Score: <span id="score">0</span></h3>
            <p class="info">Use arrow keys or WASD to move. Eat food to grow. Don't hit walls or yourself.</p>
            <div class="controls">
              <button id="start" class="btn">Start</button>
              <button id="pause" class="btn ghost">Pause</button>
              <button id="reset" class="btn ghost">Reset</button>
            </div>
            <div style="margin-top:12px">
              <label style="display:block;margin-bottom:6px">Player name (for leaderboard):</label>
              <input id="playerName" placeholder="Your name" style="width:100%;padding:8px;border-radius:8px;border:1px solid #e5e7eb" />
            </div>
          </div>
          <div class="card" style="margin-top:12px">
            <h4>Touch Controls</h4>
            <div id="touch-controls" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
              <button class="btn ghost tc" id="tc-up">↑</button>
              <button class="btn ghost tc" id="tc-left">←</button>
              <button class="btn ghost tc" id="tc-down">↓</button>
              <button class="btn ghost tc" id="tc-right">→</button>
            </div>
            <p class="info" style="margin-top:8px">Tap these on mobile to control the snake.</p>
          </div>
        </div>
      </div>
    </main>
    <script src="/static/snake.js"></script>
  </body>
</html>
